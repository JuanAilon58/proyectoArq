<div class="duel-topbar">
  <a id="duelBack" class="duel-back" href="catalogo.html"
    ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 12H4m6-6-6 6 6 6" /></svg
    >Volver al catálogo</a
  >
  <a class="duel-change-link" href="#chooseProducts">Cambiar productos</a>
</div>
<section class="duel-heading" aria-labelledby="duelTitle">
  <div class="duel-heading-line">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 4v16M16 4v16M4 8h8m0 8h8" />
    </svg>
    <div>
      <h1 id="duelTitle">Comparativa de productos</h1>
      <div class="duel-heading-meta">
        <span id="duelGroup">Álbum Tecnológico</span><span id="duelIds"></span>
      </div>
    </div>
  </div>
  <p id="duelDescription">
    Dos opciones de una misma subcategoría, frente a frente.
  </p>
</section>
<div
  id="duelLive"
  class="visually-hidden"
  role="status"
  aria-live="polite"
></div>
<section id="duelCards" class="duel-cards" aria-label="Productos A y B">
  <p>Cargando productos…</p>
</section>
<section class="duel-specs" aria-label="Especificaciones comparadas">
  <div id="duelSummary" class="duel-summary"></div>
  <div class="duel-table-toolbar">
    <label
      ><input type="checkbox" id="duelDifferences" />Solo diferencias</label
    >
    <div>
      <button type="button" id="shareDuel">Copiar enlace</button
      ><button type="button" id="printDuel">Imprimir</button>
    </div>
  </div>
  <div class="duel-table-wrap">
    <table id="duelTable" class="duel-table"></table>
  </div>
  <div
    id="duelLegend"
    class="duel-legend"
    aria-label="Leyenda de resultados"
  ></div>
  <div id="duelShareFallback" class="duel-share-fallback" hidden></div>
</section>
<div id="duelVerdict"></div>
<section
  id="chooseProducts"
  class="duel-chooser"
  aria-labelledby="chooserTitle"
>
  <h2 id="chooserTitle">Cambia la comparativa</h2>
  <p id="duelPoolCount"></p>
  <div class="duel-chooser-grid">
    <div class="field">
      <label for="duelCategory">Categoría / subcategoría</label
      ><select id="duelCategory"></select>
    </div>
    <div class="field" id="duelRangeField" hidden>
      <label for="duelRange">Gama de smartphones</label
      ><select id="duelRange">
        <option value="baja">Baja</option>
        <option value="media">Media</option>
        <option value="alta">Alta</option>
      </select>
    </div>
    <div class="field">
      <label for="productA" class="side-0">Producto A</label
      ><select id="productA"></select>
    </div>
    <div class="field">
      <label for="productB" class="side-1">Producto B</label
      ><select id="productB"></select>
    </div>
  </div>
  <div class="duel-chooser-actions">
    <button type="button" id="swapDuel" class="duel-back">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4" /></svg
      >Intercambiar A y B</button
    ><a href="#duelTitle" class="duel-back">Ver resultado de la comparativa</a>
  </div>
</section>
<section class="duel-all" aria-labelledby="directoryTitle">
  <div class="duel-directory-heading">
    <div>
      <h2 id="directoryTitle">Todos los productos tienen comparativa</h2>
      <p id="duelDirectoryCount"></p>
    </div>
    <div class="field">
      <label for="duelSearch">Buscar producto</label
      ><input
        type="search"
        id="duelSearch"
        placeholder="Marca, modelo o subcategoría"
      />
    </div>
  </div>
  <div id="duelDirectory" class="duel-directory"></div>
</section>
